name: KPI Data Quality & Observability Pipeline Schedule

on:
  # Automated schedule: runs every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  
  # Manual trigger button in GitHub UI
  workflow_dispatch:

jobs:
  run-observability-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Project Code
        uses: actions/checkout@v4

      - name: 2. Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Execute End-to-End Monitoring Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/run_full_pipeline.py